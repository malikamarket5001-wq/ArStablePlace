name: Build AR Stable Place APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Download bundled GLB model
        run: |
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/sceneview/sceneview/c18c3c8a7f3065cb83cb9833eedd6829d90db18e/samples/android-demo/src/main/assets/models/khronos_lantern.glb" \
            --output app/src/main/assets/models/stable_model.glb
          test -s app/src/main/assets/models/stable_model.glb

      - name: Build debug APK
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain > build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArStablePlace-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail when Gradle failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          echo "Gradle build failed. Diagnostic log was uploaded."
          exit 1

      - name: Upload APK artifact
        if: steps.gradle_build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ArStablePlace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
